apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: workload-observer
  namespace: example-web-dev
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "endpoints"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["route.openshift.io"]
    resources: ["routes"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: example-app-operators-observer
  namespace: example-web-dev
subjects:
  - kind: Group
    apiGroup: rbac.authorization.k8s.io
    name: example-app-operators
roleRef:
  kind: Role
  apiGroup: rbac.authorization.k8s.io
  name: workload-observer
