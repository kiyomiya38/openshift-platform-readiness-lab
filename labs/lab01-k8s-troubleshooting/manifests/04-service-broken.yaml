# BROKEN BY DESIGN: Service selector (app=wrong-value) と Pod label が一致しません。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-demo
  namespace: os-readiness-lab
  labels:
    training-case: service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: service-demo
  template:
    metadata:
      labels:
        app: service-demo
        training-case: service
    spec:
      automountServiceAccountToken: false
      containers:
        - name: app
          image: registry.k8s.io/e2e-test-images/agnhost:2.53
          args: ["netexec", "--http-port=8080"]
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: service-broken
  namespace: os-readiness-lab
  labels:
    training-case: service
spec:
  selector:
    app: wrong-value
  ports:
    - name: http
      port: 80
      targetPort: http
