# ANSWER: 正常に常駐する command へ修正。
apiVersion: v1
kind: Pod
metadata:
  name: crashloop-fixed
  namespace: os-readiness-lab
  labels:
    training-case: crashloop
    training-result: fixed
spec:
  automountServiceAccountToken: false
  containers:
    - name: app
      image: alpine:3.20
      command: ["/bin/sh", "-c"]
      args: ["echo 'TRAINING: running'; sleep 3600"]
      resources:
        requests:
          cpu: 5m
          memory: 8Mi
        limits:
          cpu: 20m
          memory: 32Mi
