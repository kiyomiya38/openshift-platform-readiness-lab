# ANSWER: 利用可能な Image へ修正。非接続環境では mirror 上の同等 Image を要確認。
apiVersion: v1
kind: Pod
metadata:
  name: imagepull-fixed
  namespace: os-readiness-lab
  labels:
    training-case: imagepull
    training-result: fixed
spec:
  automountServiceAccountToken: false
  containers:
    - name: app
      image: registry.k8s.io/pause:3.10
      resources:
        requests:
          cpu: 5m
          memory: 8Mi
        limits:
          cpu: 20m
          memory: 32Mi
